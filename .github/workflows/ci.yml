name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test

  # Static analysis on the current Go; the job above proves the minimum
  # in go.mod still builds and passes.
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: GOOS=windows go vet ./...   # the !unix fallback has to keep compiling
