# goreleaser v2 — `goreleaser check` validates, `goreleaser release --clean`
# runs on a v* tag (.github/workflows/release.yml).
version: 2

project_name: mcp-defer

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: mcp-defer
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^test:", "^ci:", "^build:", "^style:"]

# Homebrew cask in stefanahman/homebrew-tap: `brew install --cask stefanahman/tap/mcp-defer`.
# Casks (not formulas) are what goreleaser recommends for prebuilt binaries;
# the binaries are unsigned, so the hook strips the quarantine attribute.
homebrew_casks:
  - name: mcp-defer
    repository:
      owner: stefanahman
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/stefanahman/mcp-defer
    description: "Start an MCP stdio server on its first tool call, not at session start; discovery is answered from a cache"
    license: MIT
    binaries: [mcp-defer]
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mcp-defer"]
          end
