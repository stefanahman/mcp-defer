# goreleaser v2 — `goreleaser check` validates, `goreleaser release --clean`
# runs on a v* tag (.github/workflows/release.yml).
version: 2

project_name: mcp-defer

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: mcp-defer
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^test:", "^ci:", "^build:", "^style:"]

# Homebrew cask in stefanahman/homebrew-tap: `brew install --cask stefanahman/tap/mcp-defer`.
# Casks (not formulas) are what goreleaser recommends for prebuilt binaries;
# the binaries are unsigned, so a postflight step strips the quarantine
# attribute.
homebrew_casks:
  - name: mcp-defer
    repository:
      owner: stefanahman
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/stefanahman/mcp-defer
    description: "Start MCP servers on their first tool call, not at session start"
    license: MIT
    binaries: [mcp-defer]
    # Raw, not hooks.post.install: Homebrew deprecated the postflight
    # stanza that hook writes, and warns on every install and upgrade
    # ("Calling `postflight` is deprecated!"). Its replacement,
    # postflight_steps, takes a declarative DSL rather than Ruby, which
    # goreleaser cannot write yet (goreleaser/goreleaser#6873). The
    # block lands at the top of the cask, out of Homebrew's stanza order,
    # which only `brew style` minds. {{staged_path}} is Homebrew's token
    # and goreleaser templates the cask once, so it is escaped once.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/mcp-defer"]
        end
      end
